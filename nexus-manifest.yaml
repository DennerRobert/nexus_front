# Manifesto Backend — Nexus
# Plataforma Corporativa de Gestão de Portfólio, Projetos e Inovação

project:
  framework: fastapi
  name: "nexus"
  description: "Nexus — Plataforma Corporativa de Gestão de Portfólio, Projetos e Inovação"
  package_manager: "pip"
  database: "postgresql"

  features:
    - docker
    - makefile
    - celery                   # Processamento de notificações e saúde de projetos
    - redis                    # Broker Celery e cache
    - websockets               # Notificações em tempo real
    - keycloak                 # SSO / autenticação centralizada
    - rbac
    - tenants
    - gitlab-ci


# Configurações Específicas
config:
  celery:
    broker_url: "redis://redis:6379/0"
    result_backend: "redis://redis:6379/1"
    task_serializer: "json"
    result_serializer: "json"
    accept_content: ["json"]
    timezone: "America/Sao_Paulo"
    beat_schedule:
      process_notifications:
        task: "api.tasks.process_notifications"
        schedule_seconds: 30         # Enfileira e despacha notificações pendentes
      calculate_project_health:
        task: "api.tasks.calculate_project_health"
        schedule_seconds: 86400      # Recalcula score de saúde de projetos em execução (diário)
      cleanup_audit_logs:
        task: "api.tasks.cleanup_audit_logs"
        schedule_seconds: 604800     # Purga logs de auditoria antigos (semanal)


# Módulos de Domínio
modules:
  # ============================================
  # CORE: TENANT & EMPRESA
  # ============================================
  - name: "core"
    description: "Multitenancy, empresas do grupo econômico e setores organizacionais"
    models:
      - name: "Tenant"
        description: "Tenant raiz que isola os dados de cada grupo econômico"
        behaviors:
          - "Timestamped"
        fields:
          - "id:uuid:pk:auto"
          - "nome:str:max_length=255"
          - "slug:str:max_length=100:unique"
          - "descricao:text:default=''"
          - "logo_url:str:max_length=500:null"
          - "ativo:bool:default=True"
        resource_name: "tenant"

      - name: "Empresa"
        description: "Unidade de negócio do grupo econômico vinculada a um tenant"
        behaviors:
          - "Timestamped"
        fields:
          - "id:uuid:pk:auto"
          - "tenant:fk:Tenant"
          - "nome:str:max_length=255"
          - "cnpj:str:max_length=18:null"
          - "email:str:max_length=255:null"
          - "telefone:str:max_length=30:null"
          - "descricao:text:default=''"
          - "segmento:str:max_length=100:null"
          - "ativa:bool:default=True"
          - "formulario_tipo:str:max_length=50:null"
          - "dados_adicionais:json:default={}"
        resource_name: "empresa"

      - name: "Setor"
        description: "Setor organizacional pertencente a uma empresa"
        behaviors:
          - "Timestamped"
        fields:
          - "id:uuid:pk:auto"
          - "empresa:fk:Empresa"
          - "nome:str:max_length=255"
          - "descricao:text:default=''"
          - "ativo:bool:default=True"
        resource_name: "setor"


  # ============================================
  # ACCOUNTS: USUÁRIOS & COLABORADORES
  # ============================================
  - name: "accounts"
    description: "Contas de acesso, colaboradores, vínculos empregatícios e especialidades técnicas"
    models:
      - name: "Colaborador"
        description: "Profissional do tenant com especialidades técnicas e histórico de alocações"
        behaviors:
          - "Timestamped"
        fields:
          - "id:uuid:pk:auto"
          - "tenant:fk:core.Tenant"
          - "nome:str:max_length=255"
          - "email:str:max_length=255:unique"
          - "matricula:str:max_length=50:null"
          - "ativo:bool:default=True"
          - "setores:m2m:core.Setor"
        resource_name: "colaborador"

      - name: "VinculoEmpregaticio"
        description: "Vínculo formal entre colaborador e empresa com custo/hora para rateio intercompany"
        fields:
          - "id:uuid:pk:auto"
          - "colaborador:fk:Colaborador"
          - "empresa:fk:core.Empresa"
          - "cargo:str:max_length=100:default=''"
          - "custo_hora:decimal:max_digits=10:decimal_places=2:default=0.00"
          - "carga_horaria_mensal:int:default=160"
          - "data_admissao:date:null"
          - "ativo:bool:default=True"
        resource_name: "vinculo"

      - name: "ColaboradorEspecialidade"
        description: "Área de especialidade técnica do colaborador com senioridade própria"
        fields:
          - "id:uuid:pk:auto"
          - "colaborador:fk:Colaborador"
          - "area:str:max_length=50:choices=AreaEspecialidade"
          - "senioridade:str:max_length=20:choices=SenioridadeColaborador"
          - "framework_principal:str:max_length=100:null"
        resource_name: "especialidade"

      - name: "ColaboradorEspecialidadeTecnologia"
        description: "Tecnologia dominada pelo colaborador em determinada especialidade"
        fields:
          - "id:uuid:pk:auto"
          - "especialidade:fk:ColaboradorEspecialidade"
          - "tecnologia:str:max_length=100"
          - "origem:str:max_length=30:choices=OrigemTecnologia:default='declarado'"
        resource_name: "tecnologia"

      - name: "Usuario"
        description: "Conta de acesso ao sistema vinculada opcionalmente a um colaborador"
        behaviors:
          - "Timestamped"
        fields:
          - "id:uuid:pk:auto"
          - "tenant:fk:core.Tenant"
          - "empresa:fk:core.Empresa:null"
          - "colaborador:o2o:Colaborador:null"
          - "nome:str:max_length=255"
          - "email:str:max_length=255:unique"
          - "senha_hash:str:max_length=255:default=''"
          - "avatar_url:str:max_length=500:null"
          - "perfil:str:max_length=30:choices=PerfilUsuario:default='colaborador'"
          - "ativo:bool:default=True"
          - "empresas:m2m:core.Empresa"
        resource_name: "usuario"


  # ============================================
  # CLIENTS: CLIENTES
  # ============================================
  - name: "clients"
    description: "Clientes internos e externos vinculáveis a demandas, projetos e produtos"
    models:
      - name: "Cliente"
        description: "Cliente (interno ou externo) com modelo de receita e natureza jurídica"
        behaviors:
          - "Timestamped"
        fields:
          - "id:uuid:pk:auto"
          - "tenant:fk:core.Tenant"
          - "nome:str:max_length=255"
          - "origem:str:max_length=50:default='externo'"
          - "empresa:fk:core.Empresa:null"
          - "natureza_juridica:str:max_length=10:null:choices=NaturezaJuridica"
          - "cnpj:str:max_length=18:null"
          - "email:str:max_length=255:null"
          - "telefone:str:max_length=30:null"
          - "modelo_receita:str:max_length=30:null:choices=ModeloReceita"
          - "ativo:bool:default=True"
        resource_name: "cliente"


  # ============================================
  # INNOVATION: DEMANDAS & GOVERNANÇA
  # ============================================
  - name: "innovation"
    description: "Pipeline de demandas, comitês de aprovação, votação e avaliação por critérios ponderados"
    models:
      - name: "Comite"
        description: "Comitê responsável por analisar e aprovar demandas de inovação"
        behaviors:
          - "Timestamped"
        fields:
          - "id:uuid:pk:auto"
          - "tenant:fk:core.Tenant"
          - "chefe:fk:accounts.Usuario:null"
          - "nome:str:max_length=255"
          - "descricao:text:default=''"
          - "ativo:bool:default=True"
          - "membros:m2m:accounts.Usuario"
        resource_name: "comite"

      - name: "CriterioAvaliacao"
        description: "Critério ponderado de avaliação de demandas (ex: Viabilidade Técnica, Alinhamento Estratégico)"
        fields:
          - "id:uuid:pk:auto"
          - "nome:str:max_length=255"
          - "descricao:text:default=''"
          - "peso:int:default=10"
        resource_name: "criterio"

      - name: "PerguntaAvaliacao"
        description: "Pergunta de avaliação vinculada a um critério com escala 1–5"
        fields:
          - "id:uuid:pk:auto"
          - "criterio:fk:CriterioAvaliacao"
          - "texto:text"
        resource_name: "pergunta"

      - name: "OpcaoAvaliacao"
        description: "Opção de resposta (valor + descrição) de uma pergunta de avaliação"
        fields:
          - "id:uuid:pk:auto"
          - "pergunta:fk:PerguntaAvaliacao"
          - "valor:smallint:default=1"
          - "descricao:text:default=''"
        resource_name: "opcao_avaliacao"

      - name: "Demanda"
        description: "Iniciativa/ideia submetida ao pipeline de inovação com fluxo de 10 etapas"
        behaviors:
          - "Timestamped"
        fields:
          - "id:uuid:pk:auto"
          - "tenant:fk:core.Tenant"
          - "solicitante:fk:accounts.Usuario:null"
          - "empresa_unidade_apoio:fk:core.Empresa:null"
          - "comite:fk:Comite:null"
          - "nome_proponente:str:max_length=255:default=''"
          - "titulo:str:max_length=255"
          - "estagio_ideia:str:max_length=30:null:choices=EstagioIdeia"
          - "problema_resolver:text:default=''"
          - "horizonte_inovacao:str:max_length=5:null:choices=HorizonteInovacao"
          - "prazo_desejado:date:null"
          - "status:str:max_length=30:default='aberta'"
          - "etapa:str:max_length=50:choices=EtapaDemanda:default='ideia_recebida'"
          - "exibir_vitrine:bool:default=False"
          - "observacoes:text:default=''"
          - "dados_customizados:json:default={}"
          - "clientes:m2m:clients.Cliente"
        resource_name: "demanda"

      - name: "AnexoDemanda"
        description: "Arquivo anexo vinculado a uma demanda"
        fields:
          - "id:uuid:pk:auto"
          - "demanda:fk:Demanda"
          - "upload_por:fk:accounts.Usuario:null"
          - "nome:str:max_length=255"
          - "nome_original:str:max_length=255:default=''"
          - "tipo:str:max_length=50:default=''"
          - "tamanho:bigint:default=0"
          - "created_at:datetime:auto_now_add"
        resource_name: "anexo"

      - name: "HistoricoEtapa"
        description: "Registro imutável de cada transição de etapa de uma demanda"
        fields:
          - "id:uuid:pk:auto"
          - "demanda:fk:Demanda"
          - "usuario:fk:accounts.Usuario:null"
          - "etapa_anterior:str:max_length=50:default=''"
          - "etapa_nova:str:max_length=50"
          - "observacao:text:default=''"
          - "justificativa:text:default=''"
          - "data:datetime:auto_now_add"
        resource_name: "historico_etapa"

      - name: "VotoComite"
        description: "Voto de aprovação ou rejeição de um membro do comitê sobre uma demanda"
        fields:
          - "id:uuid:pk:auto"
          - "demanda:fk:Demanda"
          - "comite:fk:Comite"
          - "membro:fk:accounts.Usuario"
          - "aprovado:bool:default=False"
          - "comentario:text:default=''"
          - "data:datetime:auto_now_add"
        constraints:
          - "unique_together: [demanda, membro]"
        resource_name: "voto"

      - name: "RespostaAvaliacao"
        description: "Resposta (1–5) de um avaliador a uma pergunta de critério de uma demanda"
        fields:
          - "id:uuid:pk:auto"
          - "demanda:fk:Demanda"
          - "pergunta:fk:PerguntaAvaliacao"
          - "criterio:fk:CriterioAvaliacao"
          - "avaliador:fk:accounts.Usuario"
          - "valor:smallint:default=1"
          - "data:datetime:auto_now_add"
        constraints:
          - "unique_together: [demanda, pergunta, avaliador]"
        resource_name: "resposta"


  # ============================================
  # PROJECTS: PROJETOS & EXECUÇÃO
  # ============================================
  - name: "projects"
    description: "Projetos, squads, alocações, sprints, tarefas e registro de horas"
    models:
      - name: "Projeto"
        description: "Projeto aprovado originado de uma demanda, com controle de custo e prazo"
        behaviors:
          - "Timestamped"
        fields:
          - "id:uuid:pk:auto"
          - "tenant:fk:core.Tenant"
          - "empresa_dona:fk:core.Empresa:null"
          - "demanda:o2o:innovation.Demanda:null"
          - "nome:str:max_length=255"
          - "descricao:text:default=''"
          - "status:str:max_length=30:choices=StatusProjeto:default='aguardando_aprovacao'"
          - "data_inicio:date:null"
          - "data_fim_prevista:date:null"
          - "data_fim_real:date:null"
          - "orcamento:decimal:max_digits=14:decimal_places=2:default=0.00"
          - "custo_atual:decimal:max_digits=14:decimal_places=2:default=0.00"
          - "clientes:m2m:clients.Cliente"
        resource_name: "projeto"

      - name: "Squad"
        description: "Equipe multidisciplinar e possivelmente transversal alocada a um projeto"
        behaviors:
          - "Timestamped"
        fields:
          - "id:uuid:pk:auto"
          - "projeto:fk:Projeto"
          - "nome:str:max_length=255"
          - "objetivo:text:default=''"
          - "status:str:max_length=20:choices=StatusSquad:default='em_formacao'"
          - "data_inicio:date:null"
          - "data_fim:date:null"
          - "custo_mensal:decimal:max_digits=14:decimal_places=2:default=0.00"
        resource_name: "squad"

      - name: "Alocacao"
        description: "Alocação formal de um colaborador em um squad com papel e percentual de dedicação"
        behaviors:
          - "Timestamped"
        fields:
          - "id:uuid:pk:auto"
          - "colaborador:fk:accounts.Colaborador"
          - "squad:fk:Squad"
          - "papel:str:max_length=30:choices=PapelAlocacao"
          - "percentual:smallint:default=100"
          - "status:str:max_length=20:choices=StatusAlocacao:default='ativo'"
          - "data_inicio:date:null"
          - "data_fim:date:null"
          - "custo_mensal:decimal:max_digits=14:decimal_places=2:default=0.00"
        resource_name: "alocacao"

      - name: "Sprint"
        description: "Sprint de desenvolvimento de um projeto (apenas uma ativa por vez)"
        behaviors:
          - "Timestamped"
        fields:
          - "id:uuid:pk:auto"
          - "projeto:fk:Projeto"
          - "nome:str:max_length=255"
          - "objetivo:text:default=''"
          - "numero:smallint:default=1"
          - "data_inicio:date:null"
          - "data_fim:date:null"
          - "status:str:max_length=20:choices=StatusSprint:default='planejamento'"
        resource_name: "sprint"

      - name: "Tarefa"
        description: "Tarefa de desenvolvimento vinculada a projeto e sprint com estimativa de horas"
        behaviors:
          - "Timestamped"
        fields:
          - "id:uuid:pk:auto"
          - "tenant:fk:core.Tenant"
          - "projeto:fk:Projeto"
          - "sprint:fk:Sprint:null"
          - "responsavel:fk:accounts.Colaborador:null"
          - "titulo:str:max_length=255"
          - "descricao:text:default=''"
          - "status:str:max_length=20:choices=StatusTarefa:default='pendente'"
          - "prioridade:str:max_length=20:choices=PrioridadeTarefa:default='media'"
          - "estimativa_horas:decimal:max_digits=6:decimal_places=2:null"
          - "horas_realizadas:decimal:max_digits=6:decimal_places=2:default=0.00"
          - "data_limite:date:null"
          - "tags:json:default=[]"
          - "ordem:int:default=0"
        resource_name: "tarefa"

      - name: "ComentarioTarefa"
        description: "Comentário de um usuário em uma tarefa"
        behaviors:
          - "Timestamped"
        fields:
          - "id:uuid:pk:auto"
          - "tarefa:fk:Tarefa"
          - "autor:fk:accounts.Usuario"
          - "conteudo:text"
        resource_name: "comentario"

      - name: "RegistroHoras"
        description: "Apontamento de horas trabalhadas com fluxo de aprovação pelo gestor"
        fields:
          - "id:uuid:pk:auto"
          - "tarefa:fk:Tarefa"
          - "colaborador:fk:accounts.Colaborador"
          - "aprovador:fk:accounts.Usuario:null"
          - "horas:decimal:max_digits=6:decimal_places=2"
          - "data:date"
          - "descricao:text:default=''"
          - "status:str:max_length=20:choices=StatusRegistroHoras:default='pendente'"
          - "data_aprovacao:datetime:null"
          - "motivo_rejeicao:text:default=''"
          - "created_at:datetime:auto_now_add"
        resource_name: "registro_hora"

      - name: "MarcoProjeto"
        description: "Marco ou entrega relevante de um projeto com responsável e data-alvo"
        behaviors:
          - "Timestamped"
        fields:
          - "id:uuid:pk:auto"
          - "projeto:fk:Projeto"
          - "responsavel:fk:accounts.Colaborador:null"
          - "titulo:str:max_length=255"
          - "descricao:text:default=''"
          - "data:date:null"
          - "data_conclusao:date:null"
          - "status:str:max_length=20:choices=StatusMarco:default='pendente'"
          - "tipo:str:max_length=20:choices=TipoMarco:default='milestone'"
          - "icone:str:max_length=50:default='flag'"
        resource_name: "marco"


  # ============================================
  # TECHNICAL_PLANNING: PLANEJAMENTO TÉCNICO
  # ============================================
  - name: "technical_planning"
    description: "Planejamentos técnicos de projetos: fases, requisitos, user stories, arquitetura e riscos"
    models:
      - name: "PlanejamentoProjeto"
        description: "Documento de planejamento técnico gerado (geralmente por IA) para um projeto"
        fields:
          - "id:uuid:pk:auto"
          - "projeto:o2o:projects.Projeto"
          - "status:str:max_length=20:choices=StatusPlanejamento:default='rascunho'"
          - "versao:smallint:default=1"
          - "gerado_em:datetime:null"
          - "gerado_por:fk:accounts.Usuario:null"
          - "editado_em:datetime:null"
          - "editado_por:fk:accounts.Usuario:null"
          - "enviado_para_revisao_por:fk:accounts.Usuario:null"
          - "aprovado_em:datetime:null"
          - "aprovado_por:fk:accounts.Usuario:null"
          - "observacoes:text:default=''"
        resource_name: "planejamento"

      - name: "HistoricoVersaoPlanejamento"
        description: "Registro de ações e versões do planejamento técnico"
        fields:
          - "id:uuid:pk:auto"
          - "planejamento:fk:PlanejamentoProjeto"
          - "versao:smallint:default=1"
          - "autor:fk:accounts.Usuario:null"
          - "acao:str:max_length=30:choices=AcaoPlanejamento"
          - "descricao:text:default=''"
          - "data:datetime:auto_now_add"
        resource_name: "historico_versao"

      - name: "FaseProjeto"
        description: "Fase do plano de trabalho com cronograma, responsáveis e dependências"
        fields:
          - "id:uuid:pk:auto"
          - "planejamento:fk:PlanejamentoProjeto"
          - "nome:str:max_length=255"
          - "descricao:text:default=''"
          - "ordem:smallint:default=1"
          - "data_inicio:date:null"
          - "data_fim:date:null"
          - "horas_estimadas:decimal:max_digits=8:decimal_places=2:default=0.00"
          - "status:str:max_length=20:choices=StatusFase:default='pendente'"
          - "responsaveis:m2m:accounts.Colaborador"
          - "dependencias:m2m:self"
        resource_name: "fase"

      - name: "MarcoPlano"
        description: "Marco do plano técnico associado a uma fase"
        fields:
          - "id:uuid:pk:auto"
          - "planejamento:fk:PlanejamentoProjeto"
          - "fase:fk:FaseProjeto:null"
          - "titulo:str:max_length=255"
          - "descricao:text:default=''"
          - "data_prevista:date:null"
        resource_name: "marco_plano"

      - name: "MarcoPlanoEntregavel"
        description: "Entregável textual de um marco do plano técnico"
        fields:
          - "id:uuid:pk:auto"
          - "marco_plano:fk:MarcoPlano"
          - "descricao:text"
        resource_name: "entregavel"

      - name: "RequisitoSistema"
        description: "Container que agrupa todos os requisitos de um planejamento"
        fields:
          - "id:uuid:pk:auto"
          - "planejamento:o2o:PlanejamentoProjeto"
        resource_name: "requisito_sistema"

      - name: "RequisitoFuncional"
        description: "Requisito funcional (RF) com código, descrição e prioridade"
        fields:
          - "id:uuid:pk:auto"
          - "requisito_sistema:fk:RequisitoSistema"
          - "user_story:fk:UserStory:null"
          - "codigo:str:max_length=20"
          - "titulo:str:max_length=255"
          - "descricao:text:default=''"
          - "prioridade:str:max_length=20:choices=PrioridadeRequisito:default='media'"
        resource_name: "requisito_funcional"

      - name: "RfCriterioAceitacao"
        description: "Critério de aceitação de um requisito funcional"
        fields:
          - "id:uuid:pk:auto"
          - "requisito_funcional:fk:RequisitoFuncional"
          - "criterio:text"
        resource_name: "rf_criterio"

      - name: "RequisitoNaoFuncional"
        description: "Requisito não-funcional (RNF) com categoria e métrica"
        fields:
          - "id:uuid:pk:auto"
          - "requisito_sistema:fk:RequisitoSistema"
          - "codigo:str:max_length=20"
          - "titulo:str:max_length=255"
          - "descricao:text:default=''"
          - "categoria:str:max_length=30:choices=CategoriaRNF"
          - "metrica:str:max_length=255:default=''"
          - "prioridade:str:max_length=20:choices=PrioridadeRequisito:default='media'"
        resource_name: "requisito_nao_funcional"

      - name: "UserStory"
        description: "User story no formato Persona / Ação / Benefício com critérios de aceitação"
        fields:
          - "id:uuid:pk:auto"
          - "requisito_sistema:fk:RequisitoSistema"
          - "codigo:str:max_length=20"
          - "persona:text"
          - "acao:text"
          - "beneficio:text"
          - "prioridade:str:max_length=20:choices=PrioridadeRequisito:default='media'"
          - "requisitos:m2m:RequisitoFuncional"
        resource_name: "user_story"

      - name: "UsCriterioAceitacao"
        description: "Critério de aceitação de uma user story"
        fields:
          - "id:uuid:pk:auto"
          - "user_story:fk:UserStory"
          - "criterio:text"
        resource_name: "us_criterio"

      - name: "CasoUso"
        description: "Caso de uso com ator principal e fluxos alternativos"
        fields:
          - "id:uuid:pk:auto"
          - "requisito_sistema:fk:RequisitoSistema"
          - "codigo:str:max_length=20"
          - "titulo:str:max_length=255"
          - "ator_principal:str:max_length=100:default=''"
        resource_name: "caso_uso"

      - name: "CasoUsoFluxoAlternativo"
        description: "Fluxo alternativo de um caso de uso com condição de ativação"
        fields:
          - "id:uuid:pk:auto"
          - "caso_uso:fk:CasoUso"
          - "condicao:text"
        resource_name: "fluxo_alternativo"

      - name: "CasoUsoFluxoPasso"
        description: "Passo ordenado de um fluxo alternativo"
        fields:
          - "id:uuid:pk:auto"
          - "fluxo_alternativo:fk:CasoUsoFluxoAlternativo"
          - "passo:text"
          - "ordem:smallint:default=1"
        resource_name: "fluxo_passo"

      - name: "RegraNegocio"
        description: "Regra de negócio documentada com código e módulo de pertencimento"
        fields:
          - "id:uuid:pk:auto"
          - "requisito_sistema:fk:RequisitoSistema"
          - "codigo:str:max_length=20"
          - "titulo:str:max_length=255"
          - "descricao:text:default=''"
          - "modulo:str:max_length=50:default=''"
        resource_name: "regra_negocio"

      - name: "ArquiteturaTecnica"
        description: "Decisões arquiteturais do projeto: stack, componentes, integrações e riscos"
        fields:
          - "id:uuid:pk:auto"
          - "planejamento:o2o:PlanejamentoProjeto"
          - "premissas:json:default=[]"
          - "restricoes:json:default=[]"
        resource_name: "arquitetura"

      - name: "StackTecnologia"
        description: "Tecnologia da stack do projeto com camada e justificativa de escolha"
        fields:
          - "id:uuid:pk:auto"
          - "arquitetura:fk:ArquiteturaTecnica"
          - "nome:str:max_length=100"
          - "versao:str:max_length=50:default=''"
          - "categoria:str:max_length=50:default=''"
          - "camada:str:max_length=50:default=''"
          - "justificativa:text:default=''"
        resource_name: "stack_tecnologia"

      - name: "ComponenteArquitetura"
        description: "Componente técnico da arquitetura com dependências entre componentes"
        fields:
          - "id:uuid:pk:auto"
          - "arquitetura:fk:ArquiteturaTecnica"
          - "nome:str:max_length=100"
          - "tipo:str:max_length=50:default=''"
          - "descricao:text:default=''"
          - "dependencias:m2m:self"
        resource_name: "componente"

      - name: "Integracao"
        description: "Integração externa documentada na arquitetura técnica"
        fields:
          - "id:uuid:pk:auto"
          - "arquitetura:fk:ArquiteturaTecnica"
          - "nome:str:max_length=100"
          - "tipo:str:max_length=50:default=''"
          - "descricao:text:default=''"
          - "endpoint:str:max_length=500:default=''"
          - "autenticacao:str:max_length=50:default=''"
        resource_name: "integracao"

      - name: "RiscoTecnico"
        description: "Risco técnico identificado na arquitetura com severidade, probabilidade e mitigação"
        fields:
          - "id:uuid:pk:auto"
          - "arquitetura:fk:ArquiteturaTecnica"
          - "titulo:str:max_length=255"
          - "descricao:text:default=''"
          - "severidade:str:max_length=10:choices=SeveridadeRisco:default='media'"
          - "probabilidade:str:max_length=10:choices=ProbabilidadeRisco:default='media'"
          - "impacto:text:default=''"
          - "mitigacao:text:default=''"
        resource_name: "risco"


  # ============================================
  # PRODUCTS: PRODUTOS
  # ============================================
  - name: "products"
    description: "Produtos resultantes de projetos aprovados, com gestão de operação e clientes"
    models:
      - name: "Produto"
        description: "Produto gerado a partir de um projeto, com CAPEX consolidado e operação contínua"
        behaviors:
          - "Timestamped"
        fields:
          - "id:uuid:pk:auto"
          - "empresa_dona:fk:core.Empresa:null"
          - "projeto_origem:fk:projects.Projeto:null"
          - "responsavel_operacao:fk:accounts.Colaborador:null"
          - "nome:str:max_length=255"
          - "descricao:text:default=''"
          - "status:str:max_length=20:choices=StatusProduto:default='ativo'"
          - "classificacao:str:max_length=20:null:choices=ClassificacaoProduto"
          - "custo_desenvolvimento:decimal:max_digits=14:decimal_places=2:default=0.00"
          - "custo_operacao_mensal:decimal:max_digits=14:decimal_places=2:default=0.00"
          - "data_lancamento:date:null"
          - "clientes:m2m:clients.Cliente"
        resource_name: "produto"


  # ============================================
  # CONFIGS: CONFIGURAÇÕES & FORMULÁRIOS
  # ============================================
  - name: "configs"
    description: "Configurações de Kanban por empresa e formulários customizáveis de demandas"
    models:
      - name: "KanbanEmpresaConfig"
        description: "Configuração do Kanban de demandas por empresa (etapas visíveis, títulos e ordem)"
        fields:
          - "id:uuid:pk:auto"
          - "empresa:o2o:core.Empresa"
          - "updated_at:datetime:auto_now"
        resource_name: "kanban_config"

      - name: "KanbanEtapaConfig"
        description: "Visibilidade, título customizado e ordem de cada etapa no Kanban de uma empresa"
        fields:
          - "id:uuid:pk:auto"
          - "kanban_config:fk:KanbanEmpresaConfig"
          - "etapa:str:max_length=50:choices=EtapaDemanda"
          - "titulo:str:max_length=100:default=''"
          - "visivel:bool:default=True"
          - "ordem:smallint:default=1"
        constraints:
          - "unique_together: [kanban_config, etapa]"
        resource_name: "kanban_etapa"

      - name: "FormularioEmpresa"
        description: "Formulário customizável por empresa exibido durante criação de demandas"
        behaviors:
          - "Timestamped"
        fields:
          - "id:uuid:pk:auto"
          - "empresa:fk:core.Empresa"
          - "titulo:str:max_length=255"
          - "descricao:text:default=''"
          - "ativo:bool:default=True"
        resource_name: "formulario"

      - name: "CampoFormulario"
        description: "Campo dinâmico de um formulário customizável"
        fields:
          - "id:uuid:pk:auto"
          - "formulario:fk:FormularioEmpresa"
          - "label:str:max_length=100"
          - "tipo:str:max_length=30:choices=TipoCampoFormulario"
          - "obrigatorio:bool:default=False"
          - "placeholder:str:max_length=255:default=''"
          - "descricao:text:default=''"
          - "ordem:smallint:default=1"
        resource_name: "campo"

      - name: "CampoFormularioOpcao"
        description: "Opção de seleção para campos do tipo seleção ou múltipla escolha"
        fields:
          - "id:uuid:pk:auto"
          - "campo:fk:CampoFormulario"
          - "opcao:str:max_length=255"
          - "ordem:smallint:default=1"
        resource_name: "campo_opcao"


  # ============================================
  # NOTIFICATIONS: NOTIFICAÇÕES
  # ============================================
  - name: "notifications"
    description: "Notificações in-app enviadas a usuários sobre eventos do sistema"
    models:
      - name: "Notificacao"
        description: "Notificação entregue a um usuário sobre demanda, projeto ou tarefa"
        fields:
          - "id:uuid:pk:auto"
          - "tenant:fk:core.Tenant"
          - "usuario:fk:accounts.Usuario"
          - "tipo:str:max_length=40:choices=TipoNotificacao"
          - "categoria:str:max_length=20:choices=CategoriaNotificacao"
          - "titulo:str:max_length=255"
          - "mensagem:text:default=''"
          - "lida:bool:default=False"
          - "link:str:max_length=500:null"
          - "entidade_id:uuid:null"
          - "created_at:datetime:auto_now_add"
        resource_name: "notificacao"


  # ============================================
  # AUDIT: AUDITORIA
  # ============================================
  - name: "audit"
    description: "Log imutável de ações sensíveis de usuários sobre entidades do sistema"
    models:
      - name: "LogAuditoria"
        description: "Registro de auditoria com dados anteriores/novos, IP e agente do usuário"
        fields:
          - "id:uuid:pk:auto"
          - "tenant:fk:core.Tenant"
          - "usuario:fk:accounts.Usuario:null"
          - "entidade_tipo:str:max_length=100:default=''"
          - "entidade_id:uuid:null"
          - "acao:str:max_length=20:choices=AcaoAuditoria"
          - "permissao_verificada:str:max_length=100:default=''"
          - "dados_anteriores:json:null"
          - "dados_novos:json:null"
          - "ip:str:max_length=45:default=''"
          - "user_agent:text:default=''"
          - "dispositivo:str:max_length=100:default=''"
          - "created_at:datetime:auto_now_add"
        resource_name: "log_auditoria"


