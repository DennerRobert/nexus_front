# ============================================
# RBAC — PAPÉIS E PERMISSÕES
# ============================================
permissions:

  # ------------------------------------------
  # Definição dos papéis (roles) do sistema
  # ------------------------------------------
  roles:
    - code: "admin"
      name: "Administrador"
      level: 100
      description: "Acesso total ao sistema. Gerencia tenants, empresas, usuários e configurações."

    - code: "gestor"
      name: "Gestor de Projetos"
      level: 70
      description: "Gestão de projetos, squads, demandas e alocações. Aprova horas e planejamentos."

    - code: "comite"
      name: "Membro de Comitê"
      level: 50
      description: "Avalia e vota em demandas de inovação. Visualiza projetos e produtos."

    - code: "colaborador"
      name: "Colaborador"
      level: 40
      description: "Executa tarefas, registra horas, cria demandas e consulta projetos alocados."

  # ------------------------------------------
  # Permissões por módulo
  # Formato: module.resource.action
  # ------------------------------------------
  module_permissions:
    # =====================
    # core
    # =====================
    - code: "core.tenant.list"
      description: "Visualizar tenants do sistema"
      roles: ["admin"]

    - code: "core.tenant.manage"
      description: "Criar, editar e desativar tenants"
      roles: ["admin"]

    - code: "core.empresa.list"
      description: "Visualizar empresas do grupo econômico"
      roles: ["admin", "gestor"]

    - code: "core.empresa.create"
      description: "Cadastrar nova empresa no tenant"
      roles: ["admin"]

    - code: "core.empresa.update"
      description: "Editar dados de empresa"
