# Manifesto Backend - Geogrid Zabbix Planning
# Plataforma de Planejamento de Rede com Monitoramento Zabbix + GIS Geogrid

project:
  framework: fastapi
  name: "geogrid_zabbix3"
  description: "Plataforma de Planejamento e Monitoramento de Infraestrutura de Rede com Integração Zabbix e Geogrid GIS"
  package_manager: "pip"
  database: "postgresql"

  features:
    - docker
    - makefile
    - celery                   # Sincronização periódica Zabbix/Geogrid
    - redis                    # Broker Celery e cache
    - websockets               # Atualização de severidade em tempo real
    - postgis
    - tenants
    - keycloak
    - rbac
    - gitlab-ci


# Configurações Específicas
config:
  celery:
    broker_url: "redis://redis:6379/0"
    result_backend: "redis://redis:6379/1"
    task_serializer: "json"
    result_serializer: "json"
    accept_content: ["json"]
    timezone: "America/Sao_Paulo"
    beat_schedule:
      sync_zabbix_frequent:
        task: "api.tasks.pull_frequent_data"
        schedule_seconds: 5
      sync_zabbix_infrequent:
        task: "api.tasks.pull_infrequent_data"
        schedule_seconds: 300
      sync_geogrid:
        task: "api.tasks.sync_geogrid_data"
        schedule_seconds: 60

  geogrid:
    base_url: "${GEOGRID_URL}"
    api_key: "${GEOGRID_API_KEY}"
    version: "v3"

  zabbix:
    base_url: "${ZABBIX_URL}"
    api_token: "${ZABBIX_API_TOKEN}"
    version: "6.4"

  docker:
    images:
      db: "postgis/postgis:16-3.4-alpine"

# Módulos de Domínio
modules:
  # ============================================
  # ZABBIX: INFRAESTRUTURA DE HOSTS
  # ============================================
  - name: "zabbix_infra"
    description: "Espelhamento da infraestrutura de hosts do Zabbix"
    models:
      - name: "Hstgrp"
        description: "Grupos de hosts do Zabbix"
        api: "readonly"
        behaviors:
          - "Timestamped"
        fields:
          - "groupid:bigint:pk:auto"
          - "name:str:max_length=255:default=''"
        resource_name: "hostgroup"

      - name: "Maintenances"
        description: "Janelas de manutenção do Zabbix"
        api: "readonly"
        behaviors:
          - "Timestamped"
        fields:
          - "maintenanceid:bigint:pk:auto"
          - "name:str:max_length=128:null"
        resource_name: "maintenance"

      - name: "Hosts"
        description: "Hosts monitorados pelo Zabbix"
        behaviors:
          - "Timestamped"
        fields:
          - "hostid:bigint:pk:auto"
          - "proxy_hostid:fk:self:null"
          - "host:str:max_length=128:default=''"
          - "name:str:max_length=128:default=''"
          - "status:int:default=0"
          - "maintenanceid:fk:Maintenances:null"
          - "templateid:fk:self:null"
          - "flags:int:default=0"
        resource_name: "host"

      - name: "Interface"
        description: "Interfaces de rede dos hosts"
        behaviors:
          - "Timestamped"
        fields:
          - "interfaceid:bigint:pk:auto"
          - "hostid:fk:Hosts:null"
          - "ip:str:max_length=64:default=''"
          - "dns:str:max_length=255:default=''"
          - "port:str:max_length=64:default=''"
        resource_name: "interface"

      - name: "HostDiscovery"
        description: "Descoberta automática de hosts"
        behaviors:
          - "Timestamped"
        fields:
          - "hostid:o2o:Hosts:pk"
          - "parent_hostid:bigint:null"
          - "parent_itemid:bigint:null"
        resource_name: "host_discovery"

      - name: "HostInventory"
        description: "Inventário do host"
        behaviors:
          - "Timestamped"
        fields:
          - "hostid:o2o:Hosts:pk"
          - "type:str:max_length=64:default=''"
          - "os:str:max_length=128:default=''"
          - "software:str:max_length=255:default=''"
          - "contact:text:default=''"
          - "location:text:default=''"
        resource_name: "host_inventory"

      - name: "HostTag"
        description: "Tags do host"
        behaviors:
          - "Timestamped"
        fields:
          - "hosttagid:bigint:pk:auto"
          - "hostid:fk:Hosts:null"
          - "tag:str:max_length=255:default=''"
          - "value:str:max_length=255:default=''"
        resource_name: "host_tag"

      - name: "Hostmacro"
        description: "Macros do host"
        behaviors:
          - "Timestamped"
        fields:
          - "hostmacroid:bigint:pk:auto"
          - "hostid:fk:Hosts:null"
          - "macro:str:max_length=255:default=''"
          - "value:str:max_length=2048:default=''"
        resource_name: "hostmacro"

      - name: "HostsGroups"
        description: "Associação host-grupo"
        behaviors:
          - "Timestamped"
        fields:
          - "hostgroupid:bigint:pk:auto"
          - "hostid:fk:Hosts:null"
          - "groupid:fk:Hstgrp:null"
        constraints:
          - "unique_together: [hostid, groupid]"
        resource_name: "hosts_group"

      - name: "HostsTemplates"
        description: "Associação host-template"
        behaviors:
          - "Timestamped"
        fields:
          - "hosttemplateid:bigint:pk:auto"
          - "hostid:fk:Hosts:null"
          - "templateid:fk:Hosts:null"
        constraints:
          - "unique_together: [hostid, templateid]"
        resource_name: "hosts_template"

      - name: "Valuemap"
        description: "Mapas de valores"
        behaviors:
          - "Timestamped"
        fields:
          - "valuemapid:bigint:pk:auto"
          - "hostid:fk:Hosts:null"
          - "name:str:max_length=64:default=''"
        resource_name: "valuemap"

  # ============================================
  # ZABBIX: MONITORAMENTO (ITEMS, TRIGGERS, EVENTS)
  # ============================================
  - name: "zabbix_monitoring"
    description: "Espelhamento do monitoramento do Zabbix"
    models:
      - name: "Items"
        description: "Itens de dados monitorados"
        behaviors:
          - "Timestamped"
        fields:
          - "itemid:bigint:pk:auto"
          - "hostid:fk:zabbix_infra.Hosts:null"
          - "name:str:max_length=255:default=''"
          - "key_field:str:max_length=2048:default=''"
          - "type:int:default=0"
          - "value_type:int:default=0"
        resource_name: "item"

      - name: "Triggers"
        description: "Triggers de monitoramento"
        behaviors:
          - "Timestamped"
        fields:
          - "triggerid:bigint:pk:auto"
          - "description:str:max_length=255:default=''"
          - "expression:str:max_length=2048:default=''"
          - "priority:int:default=0"
          - "status:int:default=0"
          - "value:int:default=0"
        resource_name: "trigger"

      - name: "Functions"
        description: "Liga Items a Triggers (cadeia de propagação de severidade)"
        behaviors:
          - "Timestamped"
        fields:
          - "functionid:bigint:pk:auto"
          - "itemid:fk:Items:null"
          - "triggerid:fk:Triggers:null"
          - "name:str:max_length=12:default=''"
          - "parameter:str:max_length=255:default=''"
        resource_name: "function"

      - name: "TriggerDepends"
        description: "Dependências entre triggers"
        behaviors:
          - "Timestamped"
        fields:
          - "triggerdepid:bigint:pk:auto"
          - "triggerid_down:fk:Triggers:null"
          - "triggerid_up:fk:Triggers:null"
        resource_name: "trigger_depend"

      - name: "TriggerDiscovery"
        description: "Descoberta automática de triggers"
        behaviors:
          - "Timestamped"
        fields:
          - "triggerid:o2o:Triggers:pk"
          - "parent_triggerid:bigint:null"
        resource_name: "trigger_discovery"

      - name: "TriggerTag"
        description: "Tags de triggers"
        behaviors:
          - "Timestamped"
        fields:
          - "triggertagid:bigint:pk:auto"
          - "triggerid:fk:Triggers:null"
          - "tag:str:max_length=255:default=''"
          - "value:str:max_length=255:default=''"
        resource_name: "trigger_tag"

      - name: "Events"
        description: "Eventos do Zabbix"
        behaviors:
          - "Timestamped"
        fields:
          - "eventid:bigint:pk"
          - "source:int:default=0"
          - "object:int:default=0"
          - "objectid:bigint:null"
        resource_name: "event"

      - name: "Problem"
        description: "Problemas ativos"
        behaviors:
          - "Timestamped"
        fields:
          - "eventid:o2o:Events:pk"
          - "severity:int:default=0:choices=SeverityStatus"
          - "name:str:max_length=2048:default=''"
          - "acknowledged:int:default=0"
          - "clock:int:default=0"
        resource_name: "problem"

      - name: "ProblemTag"
        description: "Tags de problemas"
        behaviors:
          - "Timestamped"
        fields:
          - "problemtagid:bigint:pk:auto"
          - "eventid:fk:Problem:null"
          - "tag:str:max_length=255:default=''"
          - "value:str:max_length=255:default=''"
        resource_name: "problem_tag"

  # ============================================
  # ZABBIX: SERVICES & ALERTS
  # ============================================
  - name: "zabbix_services"
    description: "Espelhamento de serviços, alertas e SLA do Zabbix"
    models:
      - name: "Services"
        description: "Serviços do Zabbix (árvore de SLA)"
        behaviors:
          - "Timestamped"
        fields:
          - "serviceid:bigint:pk:auto"
          - "name:str:max_length=128:default=''"
          - "status:int:default=0"
        resource_name: "service"

      - name: "ServiceAlarms"
        description: "Alarmes de serviço"
        behaviors:
          - "Timestamped"
        fields:
          - "servicealarmid:bigint:pk:auto"
          - "serviceid:fk:Services:null"
          - "clock:int:default=0"
          - "value:int:default=0"
        constraints:
          - "unique_together: [serviceid, clock]"
        resource_name: "service_alarm"

      - name: "ServiceProblem"
        description: "Problemas vinculados a serviços"
        behaviors:
          - "Timestamped"
        fields:
          - "service_problemid:bigint:pk:auto"
          - "eventid:fk:zabbix_monitoring.Problem:null"
          - "serviceid:fk:Services:null"
          - "severity:int:default=0"
        resource_name: "service_problem"

      - name: "ServiceProblemTag"
        description: "Tags de problema por serviço"
        behaviors:
          - "Timestamped"
        fields:
          - "service_problem_tagid:bigint:pk:auto"
          - "serviceid:fk:Services:null"
          - "tag:str:max_length=255:default=''"
        resource_name: "service_problem_tag"

      - name: "ServiceStatusRule"
        description: "Regras de cálculo de status do serviço"
        behaviors:
          - "Timestamped"
        fields:
          - "service_status_ruleid:bigint:pk:auto"
          - "serviceid:fk:Services:null"
          - "new_status:int:default=0"
        resource_name: "service_status_rule"

      - name: "ServicesLinks"
        description: "Hierarquia pai/filho da árvore de serviços"
        behaviors:
          - "Timestamped"
        fields:
          - "linkid:bigint:pk:auto"
          - "serviceupid:fk:Services:null"
          - "servicedownid:fk:Services:null"
        resource_name: "services_link"

      - name: "Actions"
        description: "Ações configuradas no Zabbix"
        behaviors:
          - "Timestamped"
        fields:
          - "actionid:bigint:pk:auto"
          - "name:str:max_length=255:default=''"
        resource_name: "action"

      - name: "MediaType"
        description: "Tipos de mídia para notificação"
        behaviors:
          - "Timestamped"
        fields:
          - "mediatypeid:bigint:pk:auto"
          - "name:str:max_length=255:default=''"
        resource_name: "media_type"

      - name: "Alerts"
        description: "Alertas enviados pelo Zabbix"
        behaviors:
          - "Timestamped"
        fields:
          - "alertid:bigint:pk:auto"
          - "actionid:fk:Actions:null"
          - "eventid:fk:zabbix_monitoring.Events:null"
          - "mediatypeid:fk:MediaType:null"
        resource_name: "alert"

      - name: "Usrgrp"
        description: "Grupos de usuários do Zabbix"
        behaviors:
          - "Timestamped"
        fields:
          - "usrgrpid:bigint:pk:auto"
          - "name:str:max_length=64:unique"
        resource_name: "usrgrp"

  # ============================================
  # PLANEJAMENTO GIS (GEOGRID)
  # ============================================
  - name: "planning"
    description: "Planejamento de rede com GIS (Geogrid + Zabbix)"
    models:
      - name: "PlanningFolder"
        description: "Estrutura de pastas para organização geográfica"
        behaviors:
          - "Timestamped"
        fields:
          - "external_id:int:unique:null"
          - "name:str:max_length=255:default='Nova Pasta'"
          - "icon_family:str:max_length=100:default='default'"
          - "parent:fk:self:null"
          - "path_array:json:default=[]"
          - "zabbix_service:fk:zabbix_services.Services:null"
          - "current_severity:int:default=0:choices=SeverityStatus"
        resource_name: "folder"

      - name: "MapMarker"
        description: "Marcadores de infraestrutura no mapa (CTO, OLT, Postes, etc.)"
        behaviors:
          - "Timestamped"
        fields:
          - "external_id:int:unique:null"
          - "element_type:str:max_length=20:default='CTO':choices=MapMarkerModelTypes"
          - "name:str:max_length=255:default=''"
          - "icon:str:max_length=100:default='default'"
          - "icon_family:str:max_length=100:default='default'"
          - "icon_type:str:max_length=50:default='default'"
          - "location:point:null:srid=4326"
          - "address:str:max_length=500:null"
          - "capacity_used:int:default=0"
          - "capacity_total:int:default=0"
          - "folder:fk:PlanningFolder:null"
          - "zabbix_host:fk:zabbix_infra.Hosts:null"
          - "current_severity:int:default=0:choices=SeverityStatus"
        resource_name: "marker"

      - name: "FiberCable"
        description: "Cabos de fibra óptica com geometria GIS"
        behaviors:
          - "Timestamped"
        fields:
          - "external_id:int:unique:null"
          - "name:str:max_length=255:default=''"
          - "icon_family:str:max_length=100:default='default'"
          - "type:str:max_length=50:default=''"
          - "path:linestring:null:geography=true"
          - "fiber_quantity:int:default=0"
          - "tube_quantity:int:default=0"
          - "fiber_standard:str:max_length=50:default='G.652.D'"
          - "color:str:max_length=7:default='#FF0000'"
          - "line_style:str:max_length=20:default='solid'"
          - "distance:float:default=0.0"
          - "slack_length:float:default=0.0"
          - "total_length_real:float:default=0.0"
          - "status:str:max_length=20:default='active':choices=FiberCableStatusChoices"
          - "layer:str:max_length=20:default='feeder':choices=FiberCableLayerChoices"
          - "installation_type:str:max_length=20:default='underground':choices=FiberCableInstallationChoices"
          - "folder:fk:PlanningFolder:null"
          - "origin_marker:fk:MapMarker:null"
          - "destination_marker:fk:MapMarker:null"
          - "zabbix_host:fk:zabbix_infra.Hosts:null"
          - "current_severity:int:default=0:choices=SeverityStatus"
          - "waypoint_markers:m2m:MapMarker"
        resource_name: "cable"

      - name: "Client"
        description: "Clientes atendidos na rede"
        behaviors:
          - "Timestamped"
        fields:
          - "external_id:int:unique:null"
          - "name:str:max_length=255"
          - "code_integration:str:max_length=50:null:unique"
          - "cpf_cnpj:str:max_length=20:null"
          - "type:str:max_length=1:choices=['F','J']:default='F'"
          - "email:str:max_length=255:null"
          - "phone:str:max_length=30:null"
          - "address:str:max_length=500:null"
          - "city:str:max_length=100:null"
          - "state:str:max_length=2:null"
        resource_name: "client"

  # ============================================
  # DIAGRAMAS & FIBRA ÓPTICA
  # ============================================
  - name: "fiber_optics"
    description: "Diagramas de fusão, equipamentos e portas"
    models:
      - name: "EquipmentType"
        description: "Tipos de equipamento (Geogrid equipamentosTipos)"
        behaviors:
          - "Timestamped"
        fields:
          - "name:str:max_length=255"
          - "type:str:max_length=50"  # divisor, olt, onu, distribuidor, roteador, outros
          - "description:str:max_length=255:default=''"
          - "default_inputs:int:default=0"
          - "default_outputs:int:default=0"
        resource_name: "equipment_type"

      - name: "CableType"
        description: "Tipos de cabo (Geogrid cabosTipos)"
        behaviors:
          - "Timestamped"
        fields:
          - "name:str:max_length=255"
          - "fibers_per_tube:int:default=12"
          - "total_fibers:int:default=12"
          - "color:str:max_length=7:default='#FFFFFF'"
          - "specification:text:default=''"
        resource_name: "cable_type"

      - name: "DiagramBaseEquipment"
        description: "Equipamento no diagrama de fusão (ex: Splitter, DIO, OLT)"
        behaviors:
          - "Timestamped"
        fields:
          - "name:str:max_length=255:default=''"
          - "marker:fk:planning.MapMarker:null"
          - "equipment_type:fk:EquipmentType:null"
          - "inputs:int:default=0"
          - "outputs:int:default=0"
          - "pos_x:float:default=0"
          - "pos_y:float:default=0"
          - "tipo_conector_entrada:str:max_length=50:default='normal'"
          - "tipo_conector_saida:str:max_length=50:default='normal'"
          - "cor_entrada:str:max_length=7:default='#FFFFFF'"
          - "cor_saida:str:max_length=7:default='#FFFFFF'"
          - "is_flipped:bool:default=False"
        resource_name: "equipment"

      - name: "DiagramFiberNode"
        description: "Nó de fibra no diagrama (representação de cabo)"
        behaviors:
          - "Timestamped"
        fields:
          - "name:str:max_length=255:default=''"
          - "fiber_cable:o2o:planning.FiberCable:null"
          - "tube_quantity:int:default=1"
          - "fibers_per_tube:int:default=12"
          - "tipo_conector:str:max_length=20:default='normal':choices=FiberOpticsChoices"
          - "custom_colors:json:default=[]"
          - "pos_x:float:default=0"
          - "pos_y:float:default=0"
          - "is_flipped:bool:default=False"
        resource_name: "fiber_node"

      - name: "FiberTube"
        description: "Tubo individual dentro de um nó de fibra"
        behaviors:
          - "Timestamped"
        fields:
          - "fiber_node:fk:DiagramFiberNode"
          - "tube_number:int:default=1"
          - "color_name:str:max_length=50"
          - "color_hex:str:max_length=7:default='#FFFFFF'"
        resource_name: "fiber_tube"

      - name: "DiagramPort"
        description: "Porta de equipamento ou filamento de fibra"
        behaviors:
          - "Timestamped"
        fields:
          - "equipment:fk:DiagramBaseEquipment:null"
          - "fiber:fk:DiagramFiberNode:null"
          - "tube:fk:FiberTube:null"
          - "fiber_global_number:int:default=0"
          - "port_number:int:default=0"
          - "is_output:bool:default=False"
          - "status:str:max_length=20:default='free':choices=FiberOpticsStatusChoices"
          - "identifier:str:max_length=50:default=''"
          - "client:fk:planning.Client:null"
          - "zabbix_item:fk:zabbix_monitoring.Items:null"
          - "zabbix_trigger:fk:zabbix_monitoring.Triggers:null"
          - "current_severity:int:default=0:choices=SeverityStatus"
        constraints:
          - "unique_together: [fiber, fiber_global_number] (condition: fiber IS NOT NULL)"
          - "unique_together: [equipment, port_number, is_output] (condition: equipment IS NOT NULL)"
        resource_name: "port"

      - name: "DiagramConnectionLink"
        description: "Fusão entre duas portas (conexão física)"
        behaviors:
          - "Timestamped"
        fields:
          - "up_port:o2o:DiagramPort"
          - "down_port:o2o:DiagramPort"
        resource_name: "connection"

  # ============================================
  # INTEGRAÇÕES & SISTEMA
  # ============================================
  - name: "integrations"
    description: "Links cross-system, logs e alertas internos"
    models:
      - name: "ZabbixEntityLink"
        description: "Mapeamento genérico de entidades do sistema para entidades Zabbix"
        behaviors:
          - "Timestamped"
        fields:
          - "content_type:fk:contenttypes.ContentType"
          - "object_id:int"
          - "zabbix_host:fk:zabbix_infra.Hosts:null"
          - "zabbix_item:fk:zabbix_monitoring.Items:null"
          - "zabbix_trigger:fk:zabbix_monitoring.Triggers:null"
          - "description:str:max_length=255:default=''"
        resource_name: "entity_link"

      - name: "GeogridStatusLog"
        description: "Histórico de mudanças de severidade nas entidades"
        behaviors:
          - "Timestamped"
        fields:
          - "content_type:fk:contenttypes.ContentType"
          - "object_id:int"
          - "old_severity:int:default=0"
          - "new_severity:int:default=0"
          - "timestamp:datetime:auto_now_add"
          - "duration:duration:null"
        resource_name: "status_log"

      - name: "InternalAlert"
        description: "Alertas internos do sistema"
        behaviors:
          - "Timestamped"
        fields:
          - "title:str:max_length=255:default=''"
          - "description:text:default=''"
          - "type:str:max_length=20:default='alert':choices=AlertType"
          - "created_at:datetime:auto_now_add"
        resource_name: "alert"

# ============================================
# CHOICES (Enums)
# ============================================
choices:
  - name: "SeverityStatus"
    type: "IntegerChoices"
    values:
      - "NOT_CLASSIFIED:0"
      - "INFORMATION:1"
      - "WARNING:2"
      - "AVERAGE:3"
      - "HIGH:4"
      - "DISASTER:5"

  - name: "AlertType"
    type: "TextChoices"
    values:
      - "ALERT:alert"
      - "INFO:info"
      - "SUCCESS:success"
      - "WARNING:warning"
      - "ERROR:error"

  - name: "FiberOpticsStatusChoices"
    type: "TextChoices"
    values:
      - "FREE:free:Livre"
      - "RESERVED:reserved:Reservado"
      - "OCCUPIED:occupied:Ocupado"
      - "BROKEN:broken:Com Defeito"

  - name: "FiberOpticsChoices"
    type: "TextChoices"
    values:
      - "NORMAL:normal"
