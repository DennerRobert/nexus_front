# ============================================
# RBAC - PAPÉIS E PERMISSÕES
# ============================================
permissions:

  # ------------------------------------------
  # Definição dos papéis (roles) do sistema
  # ------------------------------------------
  roles:
    - code: "admin"
      name: "Administrador"
      level: 100
      description: "Acesso total ao sistema. Gerencia configurações, sincronizações e infraestrutura."

    - code: "gestor_noc"
      name: "Gestor NOC"
      level: 80
      description: "Gestor do Centro de Operações de Rede. Supervisiona equipe, relatórios e escalações."

    - code: "tecnico_senior"
      name: "Técnico Senior"
      level: 60
      description: "Técnico com permissão de planejamento, edição de diagramas e gestão de equipamentos."

    - code: "tecnico"
      name: "Técnico"
      level: 40
      description: "Técnico operacional. Visualiza mapa, monitora severidade e opera diagramas."

    - code: "visualizador"
      name: "Visualizador"
      level: 20
      description: "Acesso somente leitura ao mapa, status e alertas."

    - code: "sistema"
      name: "Sistema"
      level: 0
      description: "Conta de serviço para sincronização Zabbix/Geogrid via Celery."

  # ------------------------------------------
  # Permissões por módulo
  # Formato: module.resource.action
  # ------------------------------------------
  module_permissions:
    # =====================
    # zabbix_infra
    # =====================
    - code: "zabbix_infra.host.list"
      description: "Visualizar hosts do Zabbix"
      roles: ["admin", "gestor_noc", "tecnico_senior", "tecnico", "visualizador"]

    - code: "zabbix_infra.host.sync"
      description: "Disparar sincronização de hosts"
      roles: ["admin", "sistema"]

    - code: "zabbix_infra.hostgroup.list"
      description: "Visualizar grupos de hosts"
      roles: ["admin", "gestor_noc", "tecnico_senior", "tecnico"]

    - code: "zabbix_infra.interface.list"
      description: "Visualizar interfaces de rede"
      roles: ["admin", "gestor_noc", "tecnico_senior", "tecnico"]

    - code: "zabbix_infra.host_inventory.list"
      description: "Visualizar inventário de hosts"
      roles: ["admin", "gestor_noc", "tecnico_senior"]

    # =====================
    # zabbix_monitoring
    # =====================
    - code: "zabbix_monitoring.item.list"
      description: "Visualizar itens de monitoramento"
      roles: ["admin", "gestor_noc", "tecnico_senior", "tecnico"]

    - code: "zabbix_monitoring.trigger.list"
      description: "Visualizar triggers"
      roles: ["admin", "gestor_noc", "tecnico_senior", "tecnico", "visualizador"]

    - code: "zabbix_monitoring.problem.list"
      description: "Visualizar problemas ativos"
      roles: ["admin", "gestor_noc", "tecnico_senior", "tecnico", "visualizador"]

    - code: "zabbix_monitoring.problem.acknowledge"
      description: "Reconhecer problemas"
      roles: ["admin", "gestor_noc", "tecnico_senior", "tecnico"]

    - code: "zabbix_monitoring.event.list"
      description: "Visualizar eventos"
      roles: ["admin", "gestor_noc", "tecnico_senior"]

    - code: "zabbix_monitoring.function.list"
      description: "Visualizar relação item-trigger"
      roles: ["admin", "gestor_noc", "tecnico_senior"]

    # =====================
    # zabbix_services
    # =====================
    - code: "zabbix_services.service.list"
      description: "Visualizar árvore de serviços (SLA)"
      roles: ["admin", "gestor_noc", "tecnico_senior", "tecnico", "visualizador"]

    - code: "zabbix_services.service.sync"
      description: "Disparar sincronização de serviços"
      roles: ["admin", "sistema"]

    - code: "zabbix_services.service_alarm.list"
      description: "Visualizar alarmes de serviço"
      roles: ["admin", "gestor_noc", "tecnico_senior", "tecnico"]

    - code: "zabbix_services.alert.list"
      description: "Visualizar alertas enviados"
      roles: ["admin", "gestor_noc", "tecnico_senior"]

    - code: "zabbix_services.services_link.list"
      description: "Visualizar hierarquia de serviços"
      roles: ["admin", "gestor_noc", "tecnico_senior"]

    # =====================
